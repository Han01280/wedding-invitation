<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>이병한 ♥ 노규민 결혼합니다.</title>
<meta name="description" content="병한과 규민의 결혼식에 소중한 분들을 초대합니다.">
<meta property="og:title" content="이병한 ♥ 노규민 결혼합니다.">
<meta property="og:description" content="2026년 12월 20일 일요일 낮 12시
천안 비렌티 웨딩홀">
<meta property="og:image" content="https://wedding-invitation-kappa-three-94.vercel.app/images/kakao-cover-v4.jpg">
<meta property="og:image:width" content="864">
<meta property="og:image:height" content="1080">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button id="bgmToggle" class="bgm-toggle" aria-label="배경음악 재생/정지" hidden>
  <span class="bar"></span><span class="bar"></span><span class="bar"></span>
</button>

<div class="card">

  <!-- 1. 커버 -->
  <section id="hero" class="hero"></section>

  <!-- 2. 인사말 -->
  <section class="section">
    <div class="fade-up">
      <p class="section__label">Invitation</p>
      <p id="greetingQuote" class="greeting__quote"></p>
    </div>
    <div class="fade-up">
      <p id="greetingParents" class="greeting__parents"></p>
    </div>
  </section>

  <!-- 3. 캘린더 -->
  <section class="section">
    <div class="fade-up">
      <p class="section__label">Wedding Day</p>
      <p id="weddingDateText" class="wedding-date"></p>
      <p id="weddingVenueText" class="wedding-venue"></p>
    </div>
    <div class="fade-up">
      <p id="calendarMonth" class="calendar__month"></p>
      <div id="calendarGrid" class="calendar__grid" aria-label="예식 월 달력"></div>
      <p id="ddayText" class="calendar__dday">계산 중...</p>
    </div>
  </section>

  <!-- 4. 영상 (선택) -->
  <section id="videoSection" class="section" hidden>
    <div class="fade-up">
      <p class="section__label">Video</p>
      <div class="video-wrap"><iframe id="videoFrame" allowfullscreen loading="lazy"></iframe></div>
    </div>
  </section>

  <!-- 5. 갤러리 -->
  <section class="section">
    <p class="section__label fade-up">Gallery</p>
    <div class="fade-up">
      <div class="gallery__main">
        <img id="galleryMainImg" alt="갤러리 대표 이미지">
      </div>
      <div class="gallery__thumbs-row">
        <button id="galleryPrev" class="thumbnail-arrow" aria-label="이전 이미지">‹</button>
        <div id="galleryThumbs" class="gallery__thumbs"></div>
        <button id="galleryNext" class="thumbnail-arrow" aria-label="다음 이미지">›</button>
      </div>
    </div>
  </section>

  <!-- 6. 오시는 길 -->
  <section class="section">
    <div class="fade-up">
      <p class="section__label">오시는 길</p>
      <p id="venueAddress" class="venue-addr"></p>
    </div>
    <div class="fade-up">
      <div id="mapEmbed" class="map-frame" hidden></div>
      <div class="map-buttons">
        <button type="button" class="map-btn" id="naverMapBtn"><img class="map-btn__icon" src="images/icon-navermap.png" alt="" aria-hidden="true">네이버지도</button>
        <button type="button" class="map-btn" id="kakaoMapBtn"><img class="map-btn__icon" src="images/icon-kakaomap.png" alt="" aria-hidden="true">카카오맵</button>
        <button type="button" class="map-btn" id="tmapBtn"><img class="map-btn__icon" src="images/icon-tmap.png" alt="" aria-hidden="true">티맵</button>
      </div>
    </div>
    <div id="transportList" class="transport-list fade-up"></div>
  </section>

  <!-- 6.5 예식홀 위치안내 -->
  <section class="section">
    <p class="section__label fade-up">예식홀 위치안내</p>
    <div class="fade-up">
      <img src="images/venue-guide.png" alt="예식홀 위치 안내" class="venue-guide-img">
    </div>
  </section>

  <!-- 7. 안내사항 -->
  <section id="informationSection" class="section">
    <p class="section__label fade-up">식사안내</p>
    <div id="informationList" class="fade-up"></div>
  </section>

  <!-- 8. 마음 전하실 곳 -->
  <section class="section">
    <div class="fade-up">
      <p class="section__label">마음 전하실 곳</p>
      <p class="gift__desc">멀리서도 축하의 마음을<br>전하고 싶으신 분들을 위해 기재했습니다.<br><br>소중한 축하를 보내주셔서 감사드리며,<br>따뜻한 마음에 깊이 감사드립니다.</p>
    </div>
    <div class="accordion fade-up">
      <button class="accordion__head" data-target="#accGroom">신랑측 <span>▾</span></button>
      <div class="accordion__body" id="accGroom" hidden></div>
      <button class="accordion__head" data-target="#accBride">신부측 <span>▾</span></button>
      <div class="accordion__body" id="accBride" hidden></div>
    </div>
  </section>

  <!-- 9. RSVP -->
  <section id="rsvpSection" class="section">
    <div class="fade-up">
      <p class="section__label">참석 여부 전달</p>
      <p class="rsvp__desc">결혼식에 참석해주시는 모든 분들을<br>더욱 정성껏 모시고자 하오니<br>참석 여부 전달을 부탁드립니다.</p>
    </div>
    <form id="rsvpForm" class="fade-up">
      <div class="rsvp-field">
        <label>구분</label>
        <div class="toggle-group" data-field="side">
          <button type="button" class="toggle-btn active" data-value="신랑측">신랑측</button>
          <button type="button" class="toggle-btn" data-value="신부측">신부측</button>
        </div>
      </div>
      <div class="rsvp-field">
        <label>참석 여부</label>
        <div class="toggle-group" data-field="attend">
          <button type="button" class="toggle-btn active" data-value="참석">참석</button>
          <button type="button" class="toggle-btn" data-value="미참석">미참석</button>
        </div>
      </div>
      <div class="rsvp-field">
        <label>식사 여부</label>
        <div class="toggle-group" data-field="meal">
          <button type="button" class="toggle-btn active" data-value="식사 가능">식사 가능</button>
          <button type="button" class="toggle-btn" data-value="식사 불가">식사 불가</button>
        </div>
      </div>
      <div class="rsvp-field">
        <label for="rsvpName">성함</label>
        <input type="text" id="rsvpName" placeholder="김하객" required>
      </div>
      <div class="rsvp-field">
        <label for="rsvpCount">인원</label>
        <input type="number" id="rsvpCount" min="1" value="1" required>
      </div>
      <label class="consent-row">
        <input type="checkbox" id="rsvpConsent" required>
        <span>개인정보 수집 및 이용에 동의합니다. (참석여부 전달 목적으로만 사용되며, 예식 후 파기됩니다.)</span>
      </label>
      <button type="submit" class="btn-solid" id="rsvpSubmit">제출</button>
    </form>
  </section>

  <!-- 10. 공유 -->
  <section class="section">
    <p class="section__label fade-up">Share</p>
    <div class="fade-up">
      <div class="share__buttons">
        <button id="copyLinkBtn" class="btn-outline">공유하기 (링크 복사)</button>
        <button id="kakaoShareBtn" class="btn-kakao" hidden>카카오톡 공유하기</button>
      </div>
      <p style="font-size:12px;color:#999;margin-top:16px;">QR 코드로 공유하고 싶다면 <a href="qr.html" style="color:#b08d6b;text-decoration:underline;">QR 코드 생성 도구</a>를 이용해 보세요.</p>
    </div>
  </section>

  <footer class="footer">
    <p id="footerNames"></p>
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="lightbox" class="lightbox" hidden>
  <button id="lightboxClose" class="lightbox__close" aria-label="닫기">✕</button>
  <button id="lightboxPrev" class="lightbox__arrow lightbox__arrow--prev" aria-label="이전 사진">‹</button>
  <button id="lightboxNext" class="lightbox__arrow lightbox__arrow--next" aria-label="다음 사진">›</button>
  <div id="lightboxTrack" class="lightbox__track">
    <div class="lightbox__slide"><img id="lightboxImgPrev" alt=""></div>
    <div class="lightbox__slide"><img id="lightboxImgCurrent" alt="갤러리 확대 이미지"></div>
    <div class="lightbox__slide"><img id="lightboxImgNext" alt=""></div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
